<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet"/>
    <title>letter</title>
</head>
<body>
    <!-- envelope screen  -->
    <div id="envelope-container">
        <img src="envelopeclosed.PNG" alt="Envelope" id="envelope"/>
        <p> you've got mail! hate mail for: uns</p>
    </div>

    
    <!-- letter sreen -->
    <div id="letter container">
        <div class="letter-window">
            <h1 id="letter-title"> open letter?</h1>
            
            <img src="snoopy.GIF" class="snoopy" id="letter-snoopy">
            <!-- <img src="snoopy.stamp.PNG" class="stamp" id="letter-stamp"/> -->
            

            <div class="buttons" id="letter-buttons">
                <img src="green.button.PNG" class="btn green-btn" alt="yes">
            
            <img src="hate.mail.PNG" class="mail" id="hate-mail" style="display: none;">
                <!-- <img src="green.button.PNG" class="btn green-btn" alt="yes"/> -->
                <div class="no-wrapper">
                    <img src="red.button.PNG" class="btn red-btn" alt="no"/>
                </div>  
            </div>

                <p id="final-text" class="final-text" style="display: none;">
                 <strong> date: 12-9-26 </strong></p>
            
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
